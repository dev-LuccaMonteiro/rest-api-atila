<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Atila - Pet Management</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>🐾 Atila Pet Management</h1>
    <p>Sistema de gerenciamento veterinário</p>
</header>

<nav>
    <button onclick="showSection('tutores')">Tutores</button>
    <button onclick="showSection('veterinarios')">Veterinários</button>
    <button onclick="showSection('consultas')">Consultas</button>
    <button onclick="showSection('vacinas')">Vacinas</button>
</nav>

<main>

    <section id="tutores" class="section">
        <h2>Gerenciar Tutores</h2>

        <form id="tutorForm">
            <input type="hidden" id="tutorId">

            <input type="text" id="tutorNome"
                   placeholder="Nome" required>

            <input type="email" id="tutorEmail"
                   placeholder="Email" required>

            <input type="text" id="tutorTelefone"
                   placeholder="Telefone">

            <input type="text" id="tutorEndereco"
                   placeholder="Endereço">

            <button type="submit">Salvar Tutor</button>
        </form>

        <div id="tutorList"></div>
    </section>

    <section id="veterinarios" class="section hidden">
        <h2>Gerenciar Veterinários</h2>

        <form id="veterinarioForm">
            <input type="hidden" id="veterinarioId">

            <input type="text" id="vetNome"
                   placeholder="Nome" required>

            <input type="text" id="vetCrmv"
                   placeholder="CRMV" required>

            <input type="text" id="vetEspecialidade"
                   placeholder="Especialidade">

            <input type="text" id="vetTelefone"
                   placeholder="Telefone">

            <button type="submit">Salvar Veterinário</button>
        </form>

        <div id="veterinarioList"></div>
    </section>

    <section id="consultas" class="section hidden">
        <h2>Gerenciar Consultas</h2>

        <form id="consultaForm">
            <input type="hidden" id="consultaId">

            <input type="number" id="consultaPetId"
                   placeholder="ID do Pet" required>

            <input type="number" id="consultaVetId"
                   placeholder="ID do Veterinário" required>

            <input type="datetime-local" id="consultaData"
                   required>

            <input type="text" id="consultaDescricao"
                   placeholder="Descrição">

            <select id="consultaStatus">
                <option value="Agendada">Agendada</option>
                <option value="Realizada">Realizada</option>
                <option value="Cancelada">Cancelada</option>
            </select>

            <button type="submit">Salvar Consulta</button>
        </form>

        <div id="consultaList"></div>
    </section>

    <section id="vacinas" class="section hidden">
        <h2>Gerenciar Vacinas</h2>

        <form id="vacinaForm">
            <input type="hidden" id="vacinaId">

            <input type="number" id="vacinaPetId"
                   placeholder="ID do Pet" required>

            <input type="text" id="vacinaNome"
                   placeholder="Nome da vacina" required>

            <input type="text" id="vacinaFabricante"
                   placeholder="Fabricante">

            <label>Data da aplicação</label>
            <input type="date" id="vacinaData" required>

            <label>Próxima dose</label>
            <input type="date" id="vacinaProximaDose">

            <button type="submit">Salvar Vacina</button>
        </form>

        <div id="vacinaList"></div>
    </section>

</main>

<script src="script.js"></script>

</body>
</html>
