
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetShop - Gerenciamento de Produtos</title>


</head>

<body>

<header>
    <h1>🐾 PetShop</h1>
    <p>Gerenciamento de Produtos</p>
</header>

<div class="container">

    <section class="form-container">

        <h2 id="formTitle">Cadastrar Produto</h2>

        <form id="productForm">

            <div class="form-grid">

                <input type="text" id="nome"
                       placeholder="Nome do produto" required>

                <!-- Categorias de produtos -->
                <select id="categoria" required>
                    <option value="">Selecione uma categoria</option>
                    <option value="Ração">Ração</option>
                    <option value="Petiscos">Petiscos</option>
                    <option value="Brinquedos">Brinquedos</option>
                    <option value="Higiene">Higiene</option>
                    <option value="Acessórios">Acessórios</option>
                    <option value="Medicamentos">Medicamentos</option>
                    <option value="Camas e Casinhas">Camas e Casinhas</option>
                    <option value="Coleiras e Guias">Coleiras e Guias</option>
                    <option value="Roupas">Roupas</option>
                    <option value="Outros">Outros</option>
                </select>

                <input type="number" id="valor"
                       placeholder="Valor" step="0.01" min="0" required>

                <input type="text" id="fabricante"
                       placeholder="Fabricante" required>

            </div>

            <button type="submit" class="btn-save" id="saveButton">
                Cadastrar Produto
            </button>

            <button type="button" class="btn-cancel"
                    id="cancelButton" hidden onclick="cancelEdit()">
                Cancelar
            </button>

        </form>

        <p id="message"></p>

    </section>


    <section class="products-container">

        <h2>Produtos Cadastrados</h2>

        <input
                type="text"
                id="search"
                class="search"
                placeholder="Pesquisar produto pelo nome..."
        >

        <div class="table-wrapper">

            <table>

                <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Categoria</th>
                    <th>Valor</th>
                    <th>Fabricante</th>
                    <th>Ações</th>
                </tr>
                </thead>

                <tbody id="productList">
                <tr>
                    <td colspan="6" class="empty">
                        Carregando produtos...
                    </td>
                </tr>
                </tbody>

            </table>

        </div>

    </section>

</div>




</body>
</html>
