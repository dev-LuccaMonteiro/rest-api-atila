
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetShop - Gerenciamento de Produtos</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f3f6fb;
            color: #263238;
        }

        header {
            background: #0d5c50;
            color: white;
            padding: 25px;
            text-align: center;
        }

        header h1 {
            margin-bottom: 8px;
        }

        .container {
            max-width: 1100px;
            margin: 35px auto;
            padding: 20px;
        }

        .form-container, .products-container {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px #00000010;
            margin-bottom: 25px;
        }

        h2 {
            margin-bottom: 20px;
            color: #218878;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 7px;
            outline: none;
            background: white;
            color: #263238;
        }

        input:focus, select:focus {
            border-color: #218878;
        }

        select {
            cursor: pointer;
        }

        button {
            padding: 11px 18px;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .btn-save {
            background: #00473c;
            color: white;
            margin-top: 18px;
        }

        .btn-save:hover {
            background: #206e63;
        }

        .btn-edit {
            background: #f0ad4e;
            color: white;
        }

        .btn-delete {
            background: #dc3545;
            color: white;
        }

        .btn-cancel {
            background: #777;
            color: white;
            margin-left: 8px;
        }

        .search {
            margin-bottom: 20px;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 650px;
        }

        th, td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        th {
            background: #00473c;
            color: white;
        }

        tr:hover {
            background: #f5f9fb;
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        #message {
            margin-top: 15px;
            font-weight: bold;
        }

        .empty {
            text-align: center;
            padding: 25px;
            color: #777;
        }

        @media(max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 12px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>🐾 PetShop</h1>
    <p>Gerenciamento de Produtos</p>
</header>

<div class="container">

    <section class="form-container">

        <h2 id="formTitle">Cadastrar Produto</h2>

        <form id="productForm">

            <div class="form-grid">

                <input type="text" id="nome"
                       placeholder="Nome do produto" required>

                <!-- Categorias de produtos -->
                <select id="categoria" required>
                    <option value="">Selecione uma categoria</option>
                    <option value="Ração">Ração</option>
                    <option value="Petiscos">Petiscos</option>
                    <option value="Brinquedos">Brinquedos</option>
                    <option value="Higiene">Higiene</option>
                    <option value="Acessórios">Acessórios</option>
                    <option value="Medicamentos">Medicamentos</option>
                    <option value="Camas e Casinhas">Camas e Casinhas</option>
                    <option value="Coleiras e Guias">Coleiras e Guias</option>
                    <option value="Roupas">Roupas</option>
                    <option value="Outros">Outros</option>
                </select>

                <input type="number" id="valor"
                       placeholder="Valor" step="0.01" min="0" required>

                <input type="text" id="fabricante"
                       placeholder="Fabricante" required>

            </div>

            <button type="submit" class="btn-save" id="saveButton">
                Cadastrar Produto
            </button>

            <button type="button" class="btn-cancel"
                    id="cancelButton" hidden onclick="cancelEdit()">
                Cancelar
            </button>

        </form>

        <p id="message"></p>

    </section>


    <section class="products-container">

        <h2>Produtos Cadastrados</h2>

        <input
                type="text"
                id="search"
                class="search"
                placeholder="Pesquisar produto pelo nome..."
        >

        <div class="table-wrapper">

            <table>

                <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Categoria</th>
                    <th>Valor</th>
                    <th>Fabricante</th>
                    <th>Ações</th>
                </tr>
                </thead>

                <tbody id="productList">
                <tr>
                    <td colspan="6" class="empty">
                        Carregando produtos...
                    </td>
                </tr>
                </tbody>

            </table>

        </div>

    </section>

</div>


<script>

    const API_URL = "http://localhost:8080/api/petshop";

    let editingId = null;
    let products = [];

    const form = document.getElementById("productForm");
    const productList = document.getElementById("productList");
    const message = document.getElementById("message");


    // GET - Listar produtos
    async function loadProducts() {

        try {

            const response = await fetch(API_URL);

            if (!response.ok) {
                throw new Error("Erro ao buscar produtos");
            }

            products = await response.json();

            renderProducts();

        } catch (error) {

            productList.innerHTML = `
                <tr>
                    <td colspan="6" class="empty">
                        Não foi possível conectar à API.
                    </td>
                </tr>
            `;

            showMessage("Erro ao carregar produtos!", "red");
            console.error(error);
        }
    }


    // Renderizar produtos na tabela
    function renderProducts() {

        const search = document.getElementById("search")
            .value.toLowerCase();

        const filtered = products.filter(product =>
            String(product.nome ?? "").toLowerCase().includes(search)
        );

        if (filtered.length === 0) {

            productList.innerHTML = `
                <tr>
                    <td colspan="6" class="empty">
                        Nenhum produto encontrado.
                    </td>
                </tr>
            `;

            return;
        }

        productList.innerHTML = filtered.map(product => `

            <tr>
                <td>${product.id}</td>
                <td>${escapeHTML(product.nome)}</td>
                <td>${escapeHTML(product.categoria)}</td>
                <td>${Number(product.valor).toLocaleString(
            "pt-BR",
            { style: "currency", currency: "BRL" }
        )}</td>
                <td>${escapeHTML(product.fabricante)}</td>

                <td>
                    <div class="actions">

                        <button class="btn-edit"
                            onclick="editProduct(${product.id})">
                            Editar
                        </button>

                        <button class="btn-delete"
                            onclick="deleteProduct(${product.id})">
                            Excluir
                        </button>

                    </div>
                </td>
            </tr>

        `).join("");

    }


    // Evitar inserir HTML vindo da API
    function escapeHTML(value) {

        return String(value ?? "").replace(/[&<>"']/g, char => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;"
        })[char]);

    }


    // POST - Cadastrar produto
    // PUT - Atualizar produto
    form.addEventListener("submit", async function(event) {

        event.preventDefault();

        const produto = {

            nome: document.getElementById("nome").value,
            categoria: document.getElementById("categoria").value,
            valor: Number(document.getElementById("valor").value),
            fabricante: document.getElementById("fabricante").value

        };

        try {

            let response;

            if (editingId === null) {

                response = await fetch(API_URL, {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify(produto)

                });

            } else {

                response = await fetch(`${API_URL}/${editingId}`, {

                    method: "PUT",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify(produto)

                });

            }

            if (!response.ok) {
                throw new Error("Erro na operação");
            }

            const result = await response.text();

            showMessage(
                result || (editingId === null
                    ? "Produto cadastrado!"
                    : "Produto atualizado!"),
                "green"
            );

            cancelEdit();
            await loadProducts();

        } catch (error) {

            showMessage("Erro ao salvar produto!", "red");
            console.error(error);

        }

    });


    // Preencher formulário para edição
    function editProduct(id) {

        const product = products.find(p => p.id === id);

        if (!product) return;

        editingId = id;

        document.getElementById("nome").value = product.nome;

        document.getElementById("categoria").value =
            product.categoria;

        document.getElementById("valor").value = product.valor;

        document.getElementById("fabricante").value =
            product.fabricante;

        document.getElementById("formTitle").textContent =
            "Editar Produto";

        document.getElementById("saveButton").textContent =
            "Salvar Alterações";

        document.getElementById("cancelButton").hidden = false;

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    }


    // DELETE - Excluir produto
    async function deleteProduct(id) {

        if (!confirm("Deseja realmente excluir este produto?")) {
            return;
        }

        try {

            const response = await fetch(`${API_URL}/${id}`, {
                method: "DELETE"
            });

            if (!response.ok) {
                throw new Error("Erro ao excluir produto");
            }

            const result = await response.text();

            showMessage(result, "green");

            await loadProducts();

        } catch (error) {

            showMessage("Erro ao excluir produto!", "red");
            console.error(error);

        }

    }


    // Cancelar edição
    function cancelEdit() {

        editingId = null;

        form.reset();

        document.getElementById("formTitle").textContent =
            "Cadastrar Produto";

        document.getElementById("saveButton").textContent =
            "Cadastrar Produto";

        document.getElementById("cancelButton").hidden = true;

    }


    // Exibir mensagens
    function showMessage(text, color) {

        message.textContent = text;
        message.style.color = color;

        setTimeout(() => {
            message.textContent = "";
        }, 4000);

    }


    // Pesquisa
    document.getElementById("search")
        .addEventListener("input", renderProducts);


    // Inicialização
    loadProducts();

</script>

</body>
</html>
